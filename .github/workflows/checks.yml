name: Finio checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FINIO_DISABLE_LLM: '1'
      OPENAI_API_KEY: ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: pip install --require-hashes -r requirements.lock
      - run: pip install pytest pip-audit
      - run: python -m tests.test_full_suite
      - run: python -m pytest tests/test_privacy_contact.py -q
      - run: python -m pytest tests/test_launch_safety.py tests/test_audit_regressions.py tests/test_verified_edits.py tests/test_schema_compatibility.py tests/test_review_and_invest.py tests/test_cash_balance.py tests/test_journey_fixes.py tests/test_pattern_refresh.py tests/test_security_hardening.py tests/test_account_security.py tests/test_manual_backup.py tests/test_ai_policy.py tests/test_monitor_service.py tests/test_hosted_security.py tests/test_upload_admission.py tests/test_acceptance_target.py -q
      - run: pip-audit -r requirements.lock --no-deps --disable-pip
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: npm run check:frontend
      - run: npm run test:privacy
      - run: npm run test:upload
      - run: npm run test:layout
      - run: npm run test:refresh
      - run: npm run test:auth
      - run: npm run test:facts
      - run: npm run test:dashboard
      - run: npm run test:preferences
      - run: npm run test:database
      - run: docker build -t finio-check .
      - name: Scan the complete runtime image
        run: |
          docker save --output finio-image.tar finio-check
          # Trivy runs as a non-root user; Docker creates the tar owner-readable only.
          chmod 0644 finio-image.tar
          docker run --rm --cap-drop ALL --security-opt no-new-privileges \
            -v "$PWD/finio-image.tar:/input/finio.tar:ro" \
            aquasec/trivy@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c \
            image --input /input/finio.tar --scanners vuln --offline-scan \
            --disable-telemetry --format json > finio-container-advisories.json
          python - <<'PY'
          import collections, json
          with open('finio-container-advisories.json') as source:
              report = json.load(source)
          assert report.get('Results'), 'The image scan did not report any package results'
          findings = [finding for result in report['Results'] for finding in result.get('Vulnerabilities', [])]
          print('All reported severities:', dict(collections.Counter(item['Severity'] for item in findings)))
          fixable = [item for item in findings if item['Severity'] in ('HIGH', 'CRITICAL') and item.get('FixedVersion')]
          assert not fixable, 'Runtime image contains high/critical findings with available fixes'
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: container-advisories
          path: finio-container-advisories.json
          retention-days: 14
      - run: >-
          docker run --rm --network none --read-only --cap-drop ALL
          --security-opt no-new-privileges --memory 768m --pids-limit 32
          --tmpfs /tmp:rw,noexec,nosuid,size=64m
          -e OPENBLAS_NUM_THREADS=1 -e OMP_NUM_THREADS=1 -e NUMEXPR_NUM_THREADS=1
          -v "$PWD/tests/pdf_sandbox_probe.py:/verification/probe.py:ro"
          finio-check python /verification/probe.py
