<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finio · Verify your sign-in</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <a href="index.html" class="auth-logo"><span class="brand">finio</span></a>
    <h1 class="verify-title">Verify your sign-in</h1>
    <p class="verify-text">Enter the current code from your authenticator app.</p>
    <form id="mfa-form">
      <div class="form-group"><label for="mfa-factor">Authenticator</label><select id="mfa-factor" required></select></div>
      <div class="form-group"><label for="mfa-code">Six-digit code</label><input id="mfa-code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required></div>
      <p id="mfa-error" class="data-feedback" role="alert" hidden></p>
      <button id="mfa-submit" class="btn btn-primary btn-full" disabled>Verify</button>
    </form>
    <p class="tx-help">If you have lost your authenticator, keep any signed-in device secure and contact the operator for an identity-checked recovery. A password reset does not remove two-step verification.</p>
    <button id="mfa-signout" class="link-btn">Sign out</button>
  </div>
</div>
<script type="module" src="mfa-page.js"></script>
</body>
</html>
