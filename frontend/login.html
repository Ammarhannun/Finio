<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finio · Log in</title>
  <script>(function(){try{var t=localStorage.getItem('finio-theme');if(!t)t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';document.documentElement.setAttribute('data-theme',t);}catch(e){document.documentElement.setAttribute('data-theme','dark');}})();</script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<button id="theme-toggle" class="icon-btn theme-toggle-fixed" aria-label="Toggle light or dark mode" title="Toggle theme">☼</button>
<div class="auth-page">
  <div class="auth-card">
    <a href="index.html" class="auth-logo" style="text-decoration:none;"><span class="brand">finio</span></a>
    <p class="auth-tagline">Your AI money coach</p>

    <div class="auth-tabs">
      <button class="auth-tab active" data-tab="login">Log in</button>
      <button class="auth-tab" data-tab="signup">Sign up</button>
    </div>

    <div id="auth-error" class="auth-error" role="alert"></div>
    <div id="auth-success" class="auth-success" role="status"></div>

    <!-- Shown after signup: the account is not usable until the email link is
         clicked, so say that plainly instead of dropping them on a login form
         that will reject them. -->
    <div id="verify-panel" class="verify-panel" style="display:none;">
      <h2 class="verify-title">Check your email</h2>
      <p class="verify-text">
        We sent a confirmation link to <b id="verify-email"></b>.
        Click it to activate your account, then come back and log in.
      </p>
      <p class="verify-hint">No email after a minute? Check your spam folder.</p>
      <button type="button" class="btn btn-outline btn-full" id="resend-email">Resend confirmation</button>
      <button type="button" class="btn btn-outline btn-full" id="verify-back">Back to log in</button>
    </div>

    <form id="auth-form">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" required autocomplete="email">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Your password" required autocomplete="current-password" minlength="6">
        <button type="button" id="show-password" class="link-btn" aria-pressed="false">Show password</button>
      </div>
      <button type="submit" class="btn btn-primary btn-full" id="auth-btn">Log in</button>
    </form>
    <button type="button" id="forgot-password" class="link-btn auth-recovery">Forgot password?</button>
    <p class="auth-footnote"><a href="demo.html">Explore a sample</a> · <a href="privacy.html">Your data and privacy</a></p>

    <p class="disclaimer" style="margin-top:1.5rem;">General information only, not financial advice</p>
  </div>
</div>

<script type="module">
  import { supabase, getSession, initThemeToggle } from './api.js';

  initThemeToggle();

  let mode = new URLSearchParams(location.search).get('reset') === '1' ? 'reset' : 'login';
  const tabs = document.querySelectorAll('.auth-tab');
  const btn = document.getElementById('auth-btn');
  const errorEl = document.getElementById('auth-error');
  const successEl = document.getElementById('auth-success');

  function setMode(m) {
    mode = m;
    tabs.forEach(t => t.classList.toggle('active', t.dataset.tab === m));
    btn.textContent = m === 'reset' ? 'Save new password' : m === 'login' ? 'Log in' : 'Create account';
    errorEl.style.display = 'none';
    successEl.style.display = 'none';
    document.getElementById('password').autocomplete = m === 'login' ? 'current-password' : 'new-password';
    document.getElementById('password').minLength = m === 'login' ? 6 : 12;
    document.getElementById('email').required = m !== 'reset';
    document.getElementById('email').closest('.form-group').hidden = m === 'reset';
    document.querySelector('.auth-tabs').hidden = m === 'reset';
    document.getElementById('forgot-password').hidden = m !== 'login';
    document.getElementById('password').placeholder = m === 'login' ? 'Your password' : 'At least 12 characters';
  }

  const verifyPanel = document.getElementById('verify-panel');
  const authForm = document.getElementById('auth-form');
  const tabsEl = document.querySelector('.auth-tabs');

  function showVerifyPanel(email) {
    document.getElementById('verify-email').textContent = email;
    verifyPanel.style.display = 'block';
    authForm.style.display = 'none';
    tabsEl.style.display = 'none';
    errorEl.style.display = 'none';
    successEl.style.display = 'none';
  }

  document.getElementById('verify-back').addEventListener('click', () => {
    verifyPanel.style.display = 'none';
    authForm.style.display = 'block';
    tabsEl.style.display = '';
    setMode('login');
  });

  tabs.forEach(t => t.addEventListener('click', () => setMode(t.dataset.tab)));
  setMode(mode);
  supabase.auth.onAuthStateChange((event) => {
    if (event === 'PASSWORD_RECOVERY') setMode('reset');
  });
  getSession().then(async s => {
    if (s && mode !== 'reset') { await flushPendingAge(); window.location.href = 'dashboard.html'; }
  });
  const callbackError = new URLSearchParams(location.hash.slice(1)).get('error_description');
  if (callbackError) { errorEl.textContent = 'This email link has expired or could not be used. Request a new link.'; errorEl.style.display = 'block'; }
  document.getElementById('show-password').addEventListener('click', (e) => {
    const field = document.getElementById('password');
    field.type = field.type === 'password' ? 'text' : 'password';
    e.currentTarget.textContent = field.type === 'password' ? 'Show password' : 'Hide password';
    e.currentTarget.setAttribute('aria-pressed', String(field.type === 'text'));
  });
  document.getElementById('forgot-password').addEventListener('click', async (e) => {
    const email = document.getElementById('email');
    if (!email.reportValidity()) return;
    e.currentTarget.disabled = true;
    try {
      const { error } = await supabase.auth.resetPasswordForEmail(email.value.trim(), {
        redirectTo: new URL('login.html?reset=1', location.href).href,
      });
      if (error) throw error;
      successEl.textContent = 'If an account exists, a password reset link will arrive shortly.';
      successEl.style.display = 'block';
    } catch (err) { errorEl.textContent = err.message; errorEl.style.display = 'block'; }
    finally { document.getElementById('forgot-password').disabled = false; }
  });
  document.getElementById('resend-email').addEventListener('click', async (e) => {
    e.currentTarget.disabled = true;
    try {
      const { error } = await supabase.auth.resend({ type: 'signup',
        email: document.getElementById('verify-email').textContent,
        options: { emailRedirectTo: new URL('login.html', location.href).href } });
      if (error) throw error;
      successEl.textContent = 'Confirmation requested. Please check your inbox and spam folder.';
      successEl.style.display = 'block';
    } catch (err) { errorEl.textContent = err.message; errorEl.style.display = 'block'; }
    finally { document.getElementById('resend-email').disabled = false; }
  });

  // Arriving from the landing "Get started" button → open on the signup tab.
  if (new URLSearchParams(location.search).get('signup') === '1') setMode('signup');

  document.getElementById('auth-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    errorEl.style.display = 'none';
    successEl.style.display = 'none';
    btn.disabled = true;
    btn.textContent = mode === 'login' ? 'Logging in…' : 'Creating account…';

    try {
      if (mode === 'reset') {
        if (!(await getSession())) throw new Error('Open a fresh password reset link from your email first.');
        const { error } = await supabase.auth.updateUser({ password });
        if (error) throw error;
        await supabase.auth.signOut();
        history.replaceState(null, '', 'login.html');
        setMode('login');
        successEl.textContent = 'Password updated. Log in with your new password.';
        successEl.style.display = 'block';
      } else if (mode === 'login') {
        const { error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) throw error;
        window.location.href = 'dashboard.html';
      } else {
        const { data, error } = await supabase.auth.signUp({ email, password, options: {
          emailRedirectTo: new URL('login.html', location.href).href,
        } });
        if (error) throw error;
        if (data.session) { window.location.href = 'dashboard.html'; return; }
        showVerifyPanel(email);
      }
    } catch (err) {
      errorEl.textContent = err.message;
      errorEl.style.display = 'block';
    } finally {
      btn.disabled = false;
      btn.textContent = mode === 'reset' ? 'Save new password' : mode === 'login' ? 'Log in' : 'Create account';
    }
  });
</script>
</body>
</html>
